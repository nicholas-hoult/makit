# GPUI 版 .app 打包配置（#232），由 scripts/bundle.sh 读取。
#
# 这个文件是**打包的唯一可变部分**：改名字、换图标、换 bundle id 都只动这里，
# 不动脚本。想用别的名字（比如另一台机器上）就在本地提交里覆盖这几个值，
# 冲突只会落在这一个小文件上，别把本地名字提交进公开仓库。

# Dock、启动台、菜单栏里显示的名字，也是 .app 的文件名
APP_NAME="makit"

# Tauri 版已冻结（#226），GPUI 版沿用同一个 id。
# 注意：Tauri 版 makit.app 和这个装在同一台机器上时，通知授权状态会共用（系统按 id 记）。
BUNDLE_ID="com.hoult.makit"

# 相对仓库根目录。复用 Tauri 版那套图标，已经是 icns，不用转换。
ICON_PATH="src-tauri/icons/icon.icns"
