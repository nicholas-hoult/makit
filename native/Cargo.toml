[package]
name = "makit-native"
version = "0.1.0"
description = "makit 的 GPUI 原生界面（#226）"
edition = "2021"
publish = false

[[bin]]
name = "makit-native"
path = "src/main.rs"

[dependencies]
# 本机没有 Xcode（只有命令行工具，没有 metal 编译器），着色器改成运行时编译
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
alacritty_terminal = "0.26"
# 业务逻辑（会话扫描 / 运行状态 / perf.log …）和 Tauri 版共用，不再依赖 src-tauri（#226）：
# 编译不带 tauri / wry，也不需要 ../dist 占位
makit-core = { path = "../core" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
dirs = "5"
libc = "0.2"
serde_json = "1"
# 通知（E 包，#215）：macOS 原生 UNUserNotificationCenter —— 点横幅回调、撤回、按会话替换都靠它
# （notify_rust 发出去就不管，做不到）。只开用到的 feature，少编一点
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSArray", "NSError", "NSBundle", "NSObject", "NSDictionary", "NSSet", "NSEnumerator"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger",
] }

[profile.release]
# 原型阶段要反复编 release 做测量，开增量编译省时间
incremental = true
