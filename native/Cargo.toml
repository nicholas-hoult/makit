[package]
name = "makit-native"
version = "0.1.4"
description = "makit 的 GPUI 原生界面（#226）"
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "makit-native"
path = "src/main.rs"

[dependencies]
# 本机没有 Xcode（只有命令行工具，没有 metal 编译器），着色器改成运行时编译
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
alacritty_terminal = "0.26"
# 业务逻辑（会话扫描 / 运行状态 / perf.log …）和 Tauri 版共用，不再依赖 src-tauri（#226）：
# 编译不带 tauri / wry，也不需要 ../dist 占位
makit-core = { path = "../core" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
dirs = "5"
serde_json = "1"
# 终端（A 包，#226）：链接识别正则、OSC 8 / OSC 7 的 URL 解析、中文分词（系统 CFStringTokenizer）
regex = "1"
url = "2"
percent-encoding = "2"
# alacritty 的 EventedReadWrite 要 polling 的类型（OSC 7 扫描包在 tty 外面，见 terminal/pty.rs）
polling = "3"
log = "0.4"
tracing = "0.1"
chrono = "0.4"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "env-filter", "std", "ansi", "tracing-log", "chrono"] }
rust-i18n = "4.2.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS only (#184): system notifications through UNUserNotificationCenter and CFString-based text segmentation / locale
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
# 通知（E 包，#215）：macOS 原生 UNUserNotificationCenter —— 点横幅回调、撤回、按会话替换都靠它
# （notify_rust 发出去就不管，做不到）。只开用到的 feature，少编一点
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSArray", "NSError", "NSBundle", "NSObject", "NSDictionary", "NSSet", "NSEnumerator"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger",
] }

# 开发用的「快 debug」（#258）：自己的 crate 仍是 debug（改一个文件增量编译快），依赖（GPUI、alacritty、字体、正则……）开优化，
# 运行时的帧耗时接近 release；调试信息只留行号，二进制和链接都小很多。默认的 `dev` 和 `release` 不受影响。
# 用法：`bash native/scripts/dev.sh --fast`。第一次要把依赖按 opt-level 2 全编一遍（约十分钟，之后各 worktree 共用缓存）
[profile.devfast]
inherits = "dev"
debug = "line-tables-only"

[profile.devfast.package."*"]
opt-level = 2

[profile.release]
# 原型阶段要反复编 release 做测量，开增量编译省时间
incremental = true

[dev-dependencies]
image = "0.25"
