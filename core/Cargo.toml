[package]
name = "makit-core"
version = "0.2.3"
description = "makit 的业务逻辑（会话扫描、运行状态、归档、恢复、PTY 准备、杀进程、hook、perf），不依赖任何 UI 框架；供 GPUI 版（native/）使用"
authors = ["hoult"]
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "makit_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
notify = "6"
notify-debouncer-mini = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
log = "0.4"
rust-i18n = "4.2.4"

# opencode keeps its sessions in SQLite (#284). Read-only access. macOS links the system libsqlite3 (always present, adds nothing to the
# binary); Windows has none, so it compiles SQLite in.
[target.'cfg(not(windows))'.dependencies]
rusqlite = "0.37"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# real_pty_close_tests：用 portable-pty 开真 pty，验证关 tab 杀得干净
portable-pty = "0.8"

[profile.dev]
debug = "line-tables-only"
