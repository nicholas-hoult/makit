name: Release

# 推 v* tag 触发：测试通过后打 macOS 通用包（Intel + Apple Silicon），直接发布 Release（说明取自 CHANGELOG）。
# macOS 是正式包；Windows 目前是预览版 .zip（#251，未签名、部分功能还是占位），Linux 0.3 再加 job。
# 没有签名证书：CI 里走 ad-hoc 签名，用户第一次打开要手动放行（README 有步骤）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --manifest-path native/Cargo.toml

      # Three installers: universal (what the in-app updater and Homebrew use) plus one per architecture, which is
      # about half the size. Each run reuses the already compiled targets.
      - name: Bundle (universal .app + .dmg)
        run: UNIVERSAL=1 DMG=1 bash native/scripts/bundle.sh

      # Clients up to 0.1.4 only look for exactly `makit-<version>.dmg`, so the universal installer is also published
      # under that name (an identical copy). Newer clients and Homebrew use the `-universal` name.
      - name: Plain-name copy of the universal .dmg
        run: |
          for f in native/target/release/bundle/makit-*-universal.dmg; do
            cp "$f" "${f%-universal.dmg}.dmg"
          done

      - name: Bundle (Apple Silicon .dmg)
        run: ARCH=aarch64 DMG=1 bash native/scripts/bundle.sh

      - name: Bundle (Intel .dmg)
        run: ARCH=x86_64 DMG=1 bash native/scripts/bundle.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makit-macos-universal
          path: native/target/release/bundle/makit-*.dmg

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$v" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^---$/ { exit }
              on { print }
            ' CHANGELOG.md
            if [ -f CHANGELOG.zh-CN.md ]; then
              zh=$(awk -v v="$v" '
                $0 ~ "^## \\[" v "\\]" { on = 1; next }
                on && /^## \[/ { exit }
                on && /^---$/ { exit }
                on { print }
              ' CHANGELOG.zh-CN.md)
              if [ -n "$zh" ]; then
                echo
                echo "---"
                echo
                echo "**简体中文**"
                echo "$zh"
              fi
            fi
            echo
            echo "**Unsigned build**: on first launch macOS asks you to allow the app manually, see the [README](https://github.com/${GITHUB_REPOSITORY}#first-launch-unsigned-this-step-is-required)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: makit ${{ github.ref_name }}
          body_path: release-notes.md
          files: native/target/release/bundle/makit-*.dmg

      # Keeps the Homebrew tap (<owner>/homebrew-tap) in step with the release. Needs a fine-grained token with
      # contents:write on the tap repository stored as the HOMEBREW_TAP_TOKEN secret; without it the step is skipped (#268).
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, skipping the tap update"
            exit 0
          fi
          v="${GITHUB_REF_NAME#v}"
          dmg="native/target/release/bundle/makit-${v}-universal.dmg"
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${v}/" -e "s/@SHA256@/${sha}/" packaging/homebrew/makit.rb.in > tap/Casks/makit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/makit.rb
          if git diff --cached --quiet; then
            echo "tap already up to date"
          else
            git commit -m "makit ${v}"
            git push origin HEAD
          fi

  # Windows preview (#251): plain .zip with makit.exe, attached to the release the macOS job creates.
  windows:
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Package .zip
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || v="dev"
          dir="makit-${v}-windows-x64"
          mkdir "$dir"
          cp native/target/release/makit-native.exe "$dir/makit.exe"
          cp LICENSE-APACHE LICENSE-MIT THIRD_PARTY_LICENSES.md "$dir/"
          7z a "$dir.zip" "$dir"
          echo "ZIP=$dir.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makit-windows-x64
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
