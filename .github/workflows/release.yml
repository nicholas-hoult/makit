name: Release

# 推 v* tag 触发：测试通过后打 macOS 通用包（Intel + Apple Silicon），直接发布 Release（说明取自 CHANGELOG）。
# macOS 是正式包；Windows 目前是预览版 .zip（#251，未签名、部分功能还是占位），Linux 0.3 再加 job。
# macOS 包用 Developer ID 签名并公证（#262，Secrets 见下面的 Set up signing）；推 tag 时缺 Secrets 会直接失败，不会发出没签名的包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --manifest-path native/Cargo.toml

      # Signing and notarization (#262). Repository secrets:
      #   APPLE_CERTIFICATE_BASE64    the "Developer ID Application" certificate with its private key, exported as .p12, base64
      #   APPLE_CERTIFICATE_PASSWORD  the .p12 password
      #   APPLE_SIGNING_IDENTITY      the certificate's full name, "Developer ID Application: <name> (<team id>)"
      #   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8_BASE64   an App Store Connect API key (.p8, base64) for notarytool
      # A tag build without them fails rather than publish an installer macOS will refuse to open; a manual run
      # without them just builds unsigned, for testing the rest.
      - name: Set up signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          for v in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then
              case "$GITHUB_REF" in
                refs/tags/v*) echo "::error::the secret $v is not set: refusing to publish an unsigned installer"; exit 1 ;;
                *) echo "$v is not set: building unsigned"; exit 0 ;;
              esac
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(uuidgen)"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          (umask 077; printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          (umask 077; printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8")
          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "NOTARIZE=1"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_ID=$ASC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$ASC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Three installers: universal (what the in-app updater and Homebrew use) plus one per architecture, which is
      # about half the size. Each run reuses the already compiled targets.
      - name: Bundle (universal .app + .dmg)
        run: UNIVERSAL=1 DMG=1 bash native/scripts/bundle.sh

      # Clients up to 0.1.4 only look for exactly `makit-<version>.dmg`, so the universal installer is also published
      # under that name (an identical copy). Newer clients and Homebrew use the `-universal` name.
      - name: Plain-name copy of the universal .dmg
        run: |
          for f in native/target/release/bundle/makit-*-universal.dmg; do
            cp "$f" "${f%-universal.dmg}.dmg"
          done

      - name: Bundle (Apple Silicon .dmg)
        run: ARCH=aarch64 DMG=1 bash native/scripts/bundle.sh

      - name: Bundle (Intel .dmg)
        run: ARCH=x86_64 DMG=1 bash native/scripts/bundle.sh

      # What a user's Mac will check: the installer is notarized (ticket stapled) and the app inside passes Gatekeeper
      - name: Verify signing and notarization
        if: env.SIGN_IDENTITY != ''
        run: |
          for dmg in native/target/release/bundle/makit-*.dmg; do
            echo "== $dmg"
            xcrun stapler validate "$dmg"
            spctl -a -t open --context context:primary-signature -vv "$dmg"
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -quiet -mountpoint "$mnt" "$dmg"
            xcrun stapler validate "$mnt/makit.app"
            spctl -a -t exec -vv "$mnt/makit.app"
            codesign -dv --verbose=2 "$mnt/makit.app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
            hdiutil detach -quiet "$mnt"
          done

      - name: Remove signing material
        if: always()
        run: |
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makit-macos-universal
          path: native/target/release/bundle/makit-*.dmg

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$v" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^---$/ { exit }
              on { print }
            ' CHANGELOG.md
            if [ -f CHANGELOG.zh-CN.md ]; then
              zh=$(awk -v v="$v" '
                $0 ~ "^## \\[" v "\\]" { on = 1; next }
                on && /^## \[/ { exit }
                on && /^---$/ { exit }
                on { print }
              ' CHANGELOG.zh-CN.md)
              if [ -n "$zh" ]; then
                echo
                echo "---"
                echo
                echo "**简体中文**"
                echo "$zh"
              fi
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: makit ${{ github.ref_name }}
          body_path: release-notes.md
          files: native/target/release/bundle/makit-*.dmg

      # Keeps the Homebrew tap (<owner>/homebrew-tap) in step with the release. Needs a fine-grained token with
      # contents:write on the tap repository stored as the HOMEBREW_TAP_TOKEN secret; without it the step is skipped (#268).
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, skipping the tap update"
            exit 0
          fi
          v="${GITHUB_REF_NAME#v}"
          dmg="native/target/release/bundle/makit-${v}-universal.dmg"
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${v}/" -e "s/@SHA256@/${sha}/" packaging/homebrew/makit.rb.in > tap/Casks/makit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/makit.rb
          if git diff --cached --quiet; then
            echo "tap already up to date"
          else
            git commit -m "makit ${v}"
            git push origin HEAD
          fi

  # Windows preview (#251): plain .zip with makit.exe, attached to the release the macOS job creates.
  windows:
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      # #285: without the embedded manifest the exe dies at load time ("TaskDialogIndirect not found")
      - name: Verify the exe embeds the comctl32 v6 manifest
        shell: bash
        run: grep -aq "Microsoft.Windows.Common-Controls" native/target/release/makit-native.exe

      - name: Package .zip
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || v="dev"
          dir="makit-${v}-windows-x64"
          mkdir "$dir"
          cp native/target/release/makit-native.exe "$dir/makit.exe"
          cp LICENSE-APACHE LICENSE-MIT THIRD_PARTY_LICENSES.md "$dir/"
          7z a "$dir.zip" "$dir"
          echo "ZIP=$dir.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makit-windows-x64
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
