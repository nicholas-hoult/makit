name: CI

# Compile checks on the platforms we do not develop on (#251). Compiler errors are turned into annotations so they
# are readable through the public check-runs API without logging in.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-check:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            native

      - name: cargo check core
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path core/Cargo.toml --message-format=json 2>/dev/null \
            | jq -r 'select(.reason=="compiler-message" and .message.level=="error")
                     | "::error file=\(.message.spans[0].file_name // "-"),line=\(.message.spans[0].line_start // 1)::\(.message.rendered | gsub("\n";"%0A"))"' \
            | head -40

      - name: cargo check native
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path native/Cargo.toml --message-format=json 2>/dev/null \
            | jq -r 'select(.reason=="compiler-message" and .message.level=="error")
                     | "::error file=\(.message.spans[0].file_name // "-"),line=\(.message.spans[0].line_start // 1)::\(.message.rendered | gsub("\n";"%0A"))"' \
            | head -60

      # Real test runs: failures are reported as annotations (compile errors as above, failed tests by name)
      - name: cargo test core
        shell: bash
        run: |
          cargo test --manifest-path core/Cargo.toml --no-fail-fast > core-test.log 2>&1 || true
          { grep -E "^test .* FAILED|panicked at|error(\[|:)" core-test.log || true; } | head -40 | sed -e 's/^/::error::/'
          grep -E "^test result" core-test.log | sed -e 's/^/::notice::core /' || true
          if grep -qE "^test result: FAILED|error(\[|:)" core-test.log; then exit 1; fi

      - name: cargo test native
        shell: bash
        run: |
          cargo test --manifest-path native/Cargo.toml --no-fail-fast > native-test.log 2>&1 || true
          { grep -E "^test .* FAILED|panicked at|error(\[|:)" native-test.log || true; } | head -40 | sed -e 's/^/::error::/'
          grep -E "^test result" native-test.log | sed -e 's/^/::notice::native /' || true
          if grep -qE "^test result: FAILED|error(\[|:)" native-test.log; then exit 1; fi

      - name: cargo build native (release)
        shell: bash
        run: |
          cargo build --manifest-path native/Cargo.toml --release > build.log 2>&1 && echo "::notice::release build ok" || { tail -40 build.log | sed -e 's/^/::error::/'; exit 1; }
          ls -la native/target/release/*.exe | sed -e 's/^/::notice::/'
